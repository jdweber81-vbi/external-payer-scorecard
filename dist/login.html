<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · External Payer Scorecard</title>
  <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#edf5fc,#f8fafc);font:16px Segoe UI,Arial,sans-serif;color:#14233b}.login{width:min(440px,100%);background:#fff;border:1px solid #dfe7ef;border-radius:20px;padding:38px;box-shadow:0 22px 70px rgba(0,38,119,.14)}.mark{width:54px;height:54px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#002677,#00a8e0);color:#fff;font-weight:800;margin-bottom:24px}.eyebrow{color:#005eb8;font-size:.72rem;font-weight:800;letter-spacing:.16em;margin:0 0 8px}h1{color:#002677;font-size:1.9rem;margin:0 0 10px}p{color:#627187;line-height:1.5}label{display:block;font-size:.78rem;font-weight:700;margin-top:24px}input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #bccbd9;border-radius:9px;font:inherit}button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:9px;background:#005eb8;color:#fff;font:inherit;font-weight:750;cursor:pointer}.note{font-size:.72rem;text-align:center;margin:17px 0 0}</style>
</head>
<body><main class="login"><div class="mark">CHI</div><p class="eyebrow">AUTHORIZED DEMONSTRATION</p><h1>External Payer Scorecard</h1><p>Enter the demonstration access code to continue.</p><form method="post" action="/auth/login"><label>Access code<input name="accessCode" type="password" required autofocus autocomplete="current-password"></label><button type="submit">Open scorecard</button></form><p class="note">De-identified MVP · Authorized viewers only</p></main></body>
</html>
